<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rend — cd ripper</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="/icon.svg" alt="" class="logo" width="28" height="28">
      <h1>rend</h1>
      <span class="tagline">cd ripper</span>
    </div>
    <div id="settings" class="settings"></div>
    <div id="conn" class="conn" title="live connection to rend-wui">
      <span class="conn-dot"></span>
      <span class="conn-text">connecting</span>
    </div>
  </header>
  <div class="layout">
    <nav id="rail" class="rail" role="tablist" aria-label="drives" aria-orientation="vertical"></nav>
    <div class="content">
      <main id="drives" class="drives"></main>
      <section id="empty" class="empty hidden">
        <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="29" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="32" cy="32" r="9" stroke="currentColor" stroke-width="2.5"/>
          <circle cx="32" cy="32" r="2.5" fill="currentColor"/>
        </svg>
        <h2>No drives detected</h2>
        <p>
          Insert a disc into a CD-ROM drive, or start
          <code>rend-wui --demo</code> with a simulated disc.
        </p>
      </section>
      <section class="log">
        <div class="log-inner">
          <h2>Activity</h2>
          <ol id="log-list"></ol>
        </div>
      </section>
    </div>
  </div>
  <div id="tags-modal" class="modal-backdrop hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tags-modal-title">
      <header class="modal-head">
        <h2 id="tags-modal-title">Edit tags</h2>
        <button type="button" class="icon-btn" data-close-modal aria-label="Close editor">
          <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </header>
      <div class="modal-body">
        <form id="tags-form" class="tags" data-tags=""></form>
      </div>
      <footer class="modal-foot">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" form="tags-form" class="btn btn--primary" id="tags-save">Save tags</button>
      </footer>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>

[workspace]
resolver = "2"
members = ["core", "encode", "cli", "tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
libc = "0.2"
thiserror = "2"
clap = { version = "4", features = ["derive", "color"] }
ratatui = "0.29"
crossterm = "0.28"
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1

[workspace]
resolver = "2"
members = ["core", "encode", "meta", "cli", "tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
libc = "0.2"
thiserror = "2"
lofty = "0.25"
serde = "1"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
clap = { version = "4", features = ["derive", "color"] }
ratatui = "0.29"
crossterm = "0.28"
assert_cmd = "2"
predicates = "3"
sha1 = "0.10"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
